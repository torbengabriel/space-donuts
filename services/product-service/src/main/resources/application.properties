spring.application.name=product-service
server.port=8081

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/product_db}
spring.datasource.username=${DB_USERNAME:product_service}
spring.datasource.password=${PRODUCT_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Actuator
management.endpoints.web.exposure.include=health, loggers
management.endpoint.health.show-details=never

# Logging
logging.level.root=INFO
logging.level.com.spacedonuts.product=DEBUG
logging.level.org.hibernate.SQL=DEBUG
