<div class="hero">
  <app-header #headerElement />
</div>

@if (showStickyCart()) {
  <div class="sticky-cart">
    <app-cart-button (clicked)="overlayStore.open('cart')" />
  </div>
}

<main>
  <router-outlet />
</main>

<app-overlay-container />

<app-loading-spinner />

<div class="notification-toast-container">
  @if (notificationStore.activeToast(); as toast) {
    <app-notification-toast
      [title]="toast.title"
      [message]="toast.message"
      (closed)="notificationStore.dismissToast()"
    />
  }
</div>
