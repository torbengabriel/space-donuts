<div class="hero">
  <app-header #headerElement />
</div>

@if (showStickyCart()) {
  <div class="sticky-cart">
    <app-cart-button (clicked)="cartStore.openCart()" />
  </div>
}

<main>
  <section class="product-section" id="products">
    <h2>Find Your Favourite Donut</h2>
    <p class="section-description">Discover delicious creations from across the galaxy.</p>
    <app-product-list />
  </section>

  <router-outlet />
</main>

<app-search-overlay />
<app-favorites-overlay />
<app-cart-overlay />
