<c-tabs [activeItemKey]="'home'" (activeItemKeyChange)="handleChange($event)">
  <c-tabs-list variant="underline" layout="justified">
    <button cTab itemKey="home">🍩 Donuts</button>
    <button cTab itemKey="profile">🎁 Donut Boxes</button>
    <button cTab itemKey="contact">🧋 Coffee</button>
    <button cTab itemKey="disabled">🧁 Bakery</button>
  </c-tabs-list>
  <c-tabs-content>
    <c-tab-panel class="p-3" itemKey="home">
      <app-product-list [category]="ProductCategory.DONUT" />
    </c-tab-panel>
    <c-tab-panel class="p-3" itemKey="profile">
      <app-product-list [category]="ProductCategory.DONUT_BOX" />
    </c-tab-panel>
    <c-tab-panel class="p-3" itemKey="contact">
      <app-product-list [category]="ProductCategory.COFFEE" />
    </c-tab-panel>
    <c-tab-panel class="p-3" itemKey="disabled">
      <app-product-list [category]="ProductCategory.BAKERY" />
    </c-tab-panel>
  </c-tabs-content>
</c-tabs>
