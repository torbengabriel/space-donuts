<header class="navbar">
  <!-- Brand logo -->
  <a class="logo" href="/" aria-label="Space Donuts Home">
    <img src="/images/space-donuts-logo.png" alt="Space Donuts" />
  </a>

  <!-- Main navigation -->
  <nav class="navigation" aria-label="Main navigation">
    <a href="/" class="nav-link active">Home</a>
    <a routerLink="/stores" class="nav-link">Stores</a>
    <a routerLink="/about" class="nav-link">About</a>
  </nav>

  <!-- Shopping actions -->
  <div class="nav-actions">
    <app-search-button />

    <app-favorites-button />

    <app-cart-button (clicked)="cartStore.openCart()" />

  </div>
</header>
