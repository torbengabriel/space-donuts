<header class="navbar">
  <!-- Brand logo -->
  <a class="logo" href="/" aria-label="Space Donuts Home">
    <img src="/images/space-donuts-logo.png" alt="Space Donuts" />
  </a>

  <!-- Main navigation -->
  <nav class="navigation" aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Shop</a>
    <a routerLink="/stores" routerLinkActive="active" class="nav-link">Stores</a>
    <a routerLink="/about" routerLinkActive="active" class="nav-link">About</a>
  </nav>

  <!-- Shopping actions -->
  <div class="nav-actions">
    <app-search-button />

    <app-favorites-button />

    <app-cart-button (clicked)="cartStore.openCart()" />

    @if (authService.isLoggedIn) {
      <c-dropdown>
        <button class="profile-button" cButton cDropdownToggle (click)="onProfileClick()">
          <svg lucideUserRound [size]="24"></svg>
        </button>
        <ul cDropdownMenu>
          <button
            cDropdownItem
            type="button"
            (click)="openProfileOverlay()"
          >
            My Profile
          </button>
          <button
            cDropdownItem
            type="button"
            (click)="logout()"
          >
            Logout
          </button>
        </ul>
      </c-dropdown>
    } @else {
      <button class="sign-in-button" (click)="authStore.openLogin()">
        Sign In
      </button>
    }
  </div>
</header>
