@if (quantity() === 0) {
  <button
    class="btn-primary add-to-cart-button"
    type="button"
    [attr.aria-label]="`Add ${product().name} to cart`"
    (click)="cartStore.addItem(product())"
  >
    <svg lucideShoppingCart [size]="20" aria-hidden="true"></svg>
  </button>
} @else {
  <app-quantity-selector
    [quantity]="quantity()"
    (quantityChange)="cartStore.updateQuantity(product().id, $event)"
    (remove)="cartStore.removeItem(product().id)"
  />
}
