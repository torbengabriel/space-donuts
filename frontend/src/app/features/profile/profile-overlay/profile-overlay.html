@if (loading()) {
  <p>Loading profile...</p>
} @else if (profile(); as user) {
  <div class="profile-content">
    <div class="avatar">
      {{ user.firstName?.charAt(0) }}{{ user.lastName?.charAt(0) }}
    </div>

    <h2>{{ user.firstName }} {{ user.lastName }}</h2>

    <p>{{ user.email }}</p>

    <p>Username: {{ user.username }}</p>
  </div>
}
