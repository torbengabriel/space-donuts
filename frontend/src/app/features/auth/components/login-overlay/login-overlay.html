<div class="login-overlay">
  <div class="login-content">
    <div class="login-icon">
      <svg lucideUserRound [size]="32"></svg>
    </div>

    <h2>Welcome back!</h2>

    <p>Test with username: <strong>test-customer</strong></p>
    <p>password: customer123</p>

    <button

    <span class="login-footer">
      SECURE LOGIN · SPACE DONUTS
    </span>
  </div>
</div>
