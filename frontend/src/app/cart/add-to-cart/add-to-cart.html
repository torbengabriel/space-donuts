@if (quantity() === 0) {
  <button
    class="add-to-cart-button"
    type="button"
    [attr.aria-label]="`Add ${product().title} to cart`"
    (click)="cartStore.addDonut(product())"
  >
    <svg lucideShoppingCart [size]="20" aria-hidden="true"></svg>
  </button>
} @else {
  <app-quantity-selector
    [quantity]="quantity()"
    (increment)="cartStore.increaseQuantity(product().id)"
    (decrement)="cartStore.decreaseQuantity(product().id)"
  />
}
