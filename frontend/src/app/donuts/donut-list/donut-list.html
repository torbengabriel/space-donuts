<section class="product-section" id="products">
  @if (donutsStore.isLoading()) {
    <output>Loading products…</output>
  } @else if (donutsStore.hasError()) {
    <p role="alert">Donuts could not be loaded. Please try again later.</p>
  } @else {
    <ul class="product-list">
      @for (product of donutsStore.products(); track product.id) {
        <li>
          <app-product-item [product]="product" />
        </li>
      }
    </ul>
  }
</section>
