services:
  mysql:
    image: mysql:8.4
    container_name: space-donuts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: product_db
      MYSQL_USER: product_service
      MYSQL_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  product-service:
    build:
      context: ../services/product-service
      dockerfile: Dockerfile
    container_name: space-donuts-product-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/product_db
      DB_USERNAME: product_service
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
