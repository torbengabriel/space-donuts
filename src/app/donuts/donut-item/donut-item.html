<article class="donut-card">
  <img
    class="donut-image"
    [src]="donut().image"
    [alt]="donut().title"
  />

  <div class="donut-card-content">
    <h3>{{ donut().title }}</h3>

    <p>{{ donut().description }}</p>
  </div>

    <div class="donut-card-footer">
      <span class="donut-price">
        {{ donut().price | currency:'EUR':'symbol':'1.2-2':'de-DE' }}
      </span>

      <button
        class="add-to-cart-button"
        type="button"
        [attr.aria-label]="'Add ' + donut().title + ' to cart '"
      >
        <svg lucideShoppingCart [size]="20"></svg>
      </button>
    </div>
</article>
