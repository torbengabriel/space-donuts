<app-overlay
  [open]="open()"
  (closed)="closed.emit()"
>
  <h2>Shopping Cart</h2>

  @if (cartStore.isEmpty()) {
    <p>Your shopping cart is empty.</p>
  } @else {
    <ul class="cart-items" role="list">
      @for (item of cartStore.items(); track item.donut.id) {
        <li>
          <app-cart-item
            [item]="item"
            (quantityIncreased)="cartStore.increaseQuantity(item.donut.id)"
            (quantityDecreased)="cartStore.decreaseQuantity(item.donut.id)"
          />
        </li>
      }
    </ul>

    <div class="cart-footer">
      <span class="cart-total-label">Total</span>

      <span class="cart-total-price">{{ cartStore.totalPrice() | currency }}</span>
    </div>
  }
</app-overlay>
