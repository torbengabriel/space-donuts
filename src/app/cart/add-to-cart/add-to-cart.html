@if (quantity() === 0) {
  <button
    class="add-to-cart-button"
    type="button"
    [attr.aria-label]="`Add ${donut().title} to cart`"
    (click)="cartStore.addDonut(donut())"
  >
    <svg lucideShoppingCart [size]="20" aria-hidden="true"></svg>
  </button>
} @else {
  <app-quantity-selector
    [quantity]="quantity()"
    (increment)="cartStore.increaseQuantity(donut().id)"
    (decrement)="cartStore.decreaseQuantity(donut().id)"
  />
}
