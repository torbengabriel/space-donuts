<header class="navbar">
  <!-- Brand logo -->
  <a class="logo" href="/" aria-label="Space Donuts Home">
    <img src="/images/space-donuts-logo.png" alt="Space Donuts" />
  </a>

  <!-- Main navigation -->
  <nav class="navigation" aria-label="Main navigation">
    <a href="/" class="nav-link active">Home</a>
    <a href="#donuts" class="nav-link">Donuts</a>
    <a href="#stores" class="nav-link">Stores</a>
    <a href="#mission" class="nav-link">Our Mission</a>
    <a href="#about" class="nav-link">About</a>
  </nav>

  <!-- Shopping actions -->
  <div class="nav-actions">
    <button class="icon-button" type="button" aria-label="Search">
      Search
    </button>

    <button class="cart-button" type="button" aria-label="Shopping Cart" (click)="isCartOpen.set(true)">
      <svg lucideShoppingCart [size]="24"></svg>

     @if (cartStore.totalQuantity() > 0) {
       <span class="cart-count">
         {{ cartStore.totalQuantity() }}
       </span>
     }
    </button>

    <app-cart-overlay [open]="isCartOpen()" (closed)="isCartOpen.set(false)"/>

    <a href="#signin" class="sign-in-button">Sign In</a>
  </div>
</header>
